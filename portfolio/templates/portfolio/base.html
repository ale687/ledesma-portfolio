{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Claudio Ledesma — Python backend developer focused on REST APIs, SQL and data engineering. Explore projects and get in touch.">
    <meta property="og:title" content="Claudio Ledesma | Python Backend Developer">
    <meta property="og:description" content="Explore my Python projects, REST APIs and data pipelines.">
    <meta property="og:type" content="website">

    <title>{% block title %}Claudio Ledesma | Backend Developer | Data Engineering{% endblock %}</title>

    <!-- Template CSS -->
    <link rel="stylesheet" href="{% static 'portfolio/assets/css/styles.css' %}?v=9">

    <!-- Boxicons CSS -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    {% include 'portfolio/partials/navbar.html' %}
  
    <main id="main-content" tabindex="-1">
        {% block content %} {% endblock %}
    </main>

    {% include 'portfolio/partials/footer.html' %}

        <!--===== SCROLL REVEAL =====-->
        <script src="https://unpkg.com/scrollreveal"></script>
        
        <!--===== MAIN JS =====-->
        <script src="{% static 'portfolio/assets/js/main.js' %}"></script>

</body>
</html>
